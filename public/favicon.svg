<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102a43" />
      <stop offset="100%" stop-color="#0a1929" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd1c5" />
      <stop offset="50%" stop-color="#38b2ac" />
      <stop offset="100%" stop-color="#319795" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#81e6d9" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#319795" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="url(#tealGrad)" stroke-width="4" stroke-opacity="0.4" fill="none" />

  <!-- Appliance Symbol: Premium Double-Door Refrigerator with Freezer Drawer & Sparkle -->
  <g filter="url(#glow)">
    <!-- Main Refrigerator Outer Body -->
    <rect x="136" y="96" width="240" height="320" rx="28" fill="#1e3a5f" stroke="url(#tealGrad)" stroke-width="12" />

    <!-- French Door Divider Line (Vertical) -->
    <line x1="256" y1="104" x2="256" y2="280" stroke="#0a1929" stroke-width="8" stroke-linecap="round" />

    <!-- Bottom Freezer Drawer Divider Line (Horizontal) -->
    <line x1="144" y1="288" x2="368" y2="288" stroke="#0a1929" stroke-width="8" stroke-linecap="round" />

    <!-- Left Door Handle -->
    <rect x="238" y="160" width="8" height="88" rx="4" fill="url(#accentGrad)" />

    <!-- Right Door Handle -->
    <rect x="266" y="160" width="8" height="88" rx="4" fill="url(#accentGrad)" />

    <!-- Bottom Freezer Drawer Horizontal Handle -->
    <rect x="206" y="324" width="100" height="8" rx="4" fill="url(#accentGrad)" />

    <!-- Top Left Water/Ice Dispenser Window -->
    <rect x="164" y="160" width="44" height="60" rx="8" fill="#0a1929" stroke="#38b2ac" stroke-width="4" />
    <circle cx="186" cy="184" r="5" fill="#4fd1c5" />
    <path d="M182 198 H190" stroke="#4fd1c5" stroke-width="3" stroke-linecap="round" />

    <!-- Prestige Emblem Star / Sparkle in Top Right -->
    <path d="M360 80 L368 100 L388 108 L368 116 L360 136 L352 116 L332 108 L352 100 Z" fill="url(#accentGrad)" />
    <path d="M140 380 L144 392 L156 396 L144 400 L140 412 L136 400 L124 396 L136 392 Z" fill="#38b2ac" />
  </g>
</svg>
